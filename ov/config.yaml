# Config do ov (pager): ~/.config/ov/config.yaml via mkOutOfStoreSymlink.
# ov vem do Homebrew (brews em common.nix), sempre na última versão.
# Referência completa (keybindings, estilos, modes): `ov --generate-config`
# ou https://github.com/noborus/ov/blob/master/ov.yaml
# Keybindings estilo less: `ov --generate-config=less`

# man formata negrito/sublinhado por overstrike (backspace). Sem estas duas
# chaves o ov não aplica estilo nenhum: o NewConfig() do ov não define default.
# Só valem no nível raiz, não dentro de Mode.
StyleOverStrike:
  Bold: true
StyleOverLine:
  Underline: true
